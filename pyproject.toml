[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photolib"
version = "2.0.1"
description = "A local, private photo library with natural-language and face search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
photolib = "photolib.cli:main"

[tool.setuptools.packages.find]
include = ["photolib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]
